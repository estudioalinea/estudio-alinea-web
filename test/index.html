<style>
[hidden]{display:none!important}
/* Test en una columna, pensado para el celular: una pregunta por pantalla, respuestas de un toque; resultado con medidor de semáforo y barras por área. Misma paleta fija que la landing. */
:root{
  --pizarra:#2C3649; --medianoche:#0F1E33; --cobalto:#2E4A67;
  --bronce:#B8945B; --bronce-claro:#C9A56C; --bronce-texto:#7E6235;
  --pergamino:#D8CEBE; --porcelana:#F4F0E8; --arena:#EFE9DF; --blanco:#FBF9F5;
  --tinta:#0F1E33; --tinta-suave:#46526A; --linea:#DDD5C7; --linea-osc:rgba(216,206,190,.16);
  --rojo:#B4533C; --amarillo:#D1A03C; --verde:#5B8A5E; --pista:#E4DCCF;
  --error:#9B2C1F;
  --f-sans:"Montserrat",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  --f-display:"EB Garamond",Georgia,"Times New Roman",serif;
  --f-iso:"Comfortaa","Montserrat",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
html,body{min-height:100%}
body{margin:0;background:var(--porcelana);color:var(--tinta);font-family:var(--f-sans);font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;min-height:100vh;min-height:100dvh}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--bronce);outline-offset:3px}
h1,h2,h3{margin:0;text-wrap:balance}
p{margin:0}
.envoltura{width:100%;max-width:640px;margin:0 auto;padding-inline:16px}
.etiqueta{font-size:.72rem;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--bronce-texto)}

/* Encabezado */
.barra{background:var(--pizarra);border-bottom:1px solid var(--linea-osc)}
.barra .envoltura{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px}
.logo{display:inline-flex;align-items:baseline;gap:.28em;font-size:1.15rem;letter-spacing:-.02em;line-height:1;text-decoration:none;color:var(--pergamino)}
.logo .l1{font-weight:300}.logo .l2{font-weight:700}
.logo .a{font-family:var(--f-iso);font-weight:700;color:var(--bronce);font-size:1.04em;letter-spacing:0}
.barra small{font-size:.66rem;font-weight:500;letter-spacing:.3em;color:var(--pergamino)}

main{flex:1;padding-block:28px 56px}
.pantalla{display:grid;gap:22px;animation:entrar .35s ease-out both}
@keyframes entrar{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* Botones */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:52px;font-weight:600;font-size:.95rem;text-decoration:none;padding:12px 24px;border-radius:2px;border:1px solid transparent;cursor:pointer;transition:background .2s,border-color .2s,color .2s;width:100%}
.btn-bronce{background:var(--bronce);color:var(--medianoche)}
.btn-bronce:hover{background:var(--bronce-claro)}
.btn-oscuro{background:var(--pizarra);color:var(--porcelana)}
.btn-oscuro:hover{background:var(--medianoche)}
.btn-linea{background:transparent;border-color:#CFC5B4;color:var(--tinta)}
.btn-linea:hover{border-color:var(--cobalto)}
.btn svg{width:20px;height:20px;flex:none;fill:currentColor}
.volver{justify-self:start;background:none;border:0;padding:8px 0;font-size:.85rem;font-weight:500;color:var(--tinta-suave);cursor:pointer}
.volver:hover{color:var(--tinta)}

/* Portada del test */
.intro{background:var(--pizarra);color:var(--porcelana);padding:28px 22px;display:grid;gap:16px;position:relative;overflow:hidden}
.intro .etiqueta{color:var(--bronce)}
.intro h1{font-family:var(--f-display);font-weight:500;font-size:clamp(2.1rem,8vw,2.9rem);line-height:1.04;letter-spacing:-.01em}
.intro h1 em{color:var(--bronce)}
.intro p{color:var(--pergamino);font-weight:300}
.intro .circulos{position:absolute;right:20px;top:24px;width:66px;pointer-events:none}
.datos-rapidos{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:1px solid var(--linea-osc)}
.datos-rapidos li{padding:14px 8px 0 0;display:grid;gap:2px}
.datos-rapidos li + li{padding-left:12px;border-left:1px solid var(--linea-osc)}
.datos-rapidos b{font-family:var(--f-display);font-weight:500;font-size:1.6rem;line-height:1;color:var(--porcelana)}
.datos-rapidos span{font-size:.74rem;color:var(--pergamino)}
.para-quien{font-size:.9rem;color:var(--tinta-suave)}

/* Preguntas */
.progreso{display:grid;gap:8px}
.progreso .fila{display:flex;justify-content:space-between;font-size:.78rem;font-weight:600;color:var(--tinta-suave);letter-spacing:.04em}
.progreso .pista{height:4px;background:var(--pista)}
.progreso .relleno{height:100%;background:var(--bronce);transition:width .3s ease}
.pregunta h2{font-family:var(--f-display);font-weight:500;font-size:clamp(1.65rem,6.4vw,2.1rem);line-height:1.15}
.pregunta .area{margin-bottom:10px}
.opciones{display:grid;gap:10px;margin:0;padding:0;border:0}
.opcion{display:flex;align-items:center;gap:14px;text-align:left;width:100%;min-height:60px;padding:14px 16px;background:var(--blanco);border:1px solid #CFC5B4;border-radius:2px;cursor:pointer;font-size:.97rem;line-height:1.4;transition:border-color .15s,background .15s}
.opcion::before{content:"";width:18px;height:18px;border-radius:50%;border:1.5px solid #B9AE9C;flex:none;transition:all .15s}
.opcion:hover{border-color:var(--cobalto)}
.opcion[aria-pressed="true"]{border-color:var(--cobalto);background:#EAF0F5}
.opcion[aria-pressed="true"]::before{border:5px solid var(--cobalto)}
.opcion.nose{background:transparent;border-style:dashed;color:var(--tinta-suave)}

/* Resultado */
.tarjeta{background:var(--blanco);border:1px solid var(--linea);padding:24px 20px;display:grid;gap:18px}
.medidor{display:grid;justify-items:center;gap:6px;text-align:center}
.medidor svg{width:100%;max-width:300px;height:auto;overflow:visible}
.medidor .num{font-family:var(--f-display);font-weight:500;font-size:64px;fill:var(--tinta);font-variant-numeric:lining-nums tabular-nums}
.medidor .de{font-family:var(--f-sans);font-size:15px;font-weight:500;fill:var(--tinta-suave)}
.nivel{display:inline-flex;align-items:center;gap:8px;font-size:.78rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;padding:6px 12px;border-radius:99px;color:var(--blanco)}
.nivel.rojo{background:var(--rojo)}.nivel.amarillo{background:var(--amarillo);color:var(--medianoche)}.nivel.verde{background:var(--verde)}
.medidor .frase{font-size:.98rem;color:var(--tinta-suave);max-width:36ch;margin-top:6px}
.semaforo{display:flex;justify-content:center;gap:16px;font-size:.72rem;color:var(--tinta-suave)}
.semaforo span{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.semaforo i{width:9px;height:9px;border-radius:50%;display:inline-block}

.barras{display:grid;gap:14px;margin:0;padding:0;list-style:none}
.barras li{display:grid;gap:6px}
.barras .rotulo{display:flex;justify-content:space-between;gap:10px;font-size:.88rem;font-weight:600}
.barras .rotulo span:last-child{font-weight:500;color:var(--tinta-suave);font-variant-numeric:tabular-nums}
.barras .pista{height:12px;background:var(--pista);border-radius:99px;overflow:hidden}
.barras .relleno{height:100%;width:0;border-radius:99px;transition:width .9s cubic-bezier(.2,.7,.1,1)}
.relleno.rojo{background:var(--rojo)}.relleno.amarillo{background:var(--amarillo)}.relleno.verde{background:var(--verde)}
.titulo-bloque{font-family:var(--f-display);font-weight:500;font-size:1.5rem;line-height:1.15}

/* Pedido de datos */
.candado{background:var(--medianoche);color:var(--porcelana);padding:24px 20px;display:grid;gap:18px}
.candado .etiqueta{color:var(--bronce)}
.candado h2{font-family:var(--f-display);font-weight:500;font-size:1.75rem;line-height:1.12}
.candado h2 em{color:var(--bronce)}
.candado > p{color:var(--pergamino);font-size:.95rem;font-weight:300}
.tapado{position:relative;user-select:none;pointer-events:none;max-height:230px;overflow:hidden}
.tapado .tarjeta{filter:blur(16px);opacity:.7}
.tapado .sello{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:var(--medianoche);color:var(--porcelana);font-size:.82rem;font-weight:600;letter-spacing:.04em;padding:10px 16px;border-radius:2px;white-space:nowrap;box-shadow:0 8px 22px rgba(15,30,51,.25)}
.campos{display:grid;gap:14px}
.campo{display:grid;gap:6px}
.campo label{font-size:.78rem;font-weight:600;letter-spacing:.04em;color:var(--pergamino)}
.campo input,.campo select{width:100%;font:inherit;font-size:16px;color:var(--tinta);background:var(--blanco);border:1px solid #CFC5B4;border-radius:2px;padding:12px 14px;min-height:50px}
.campo input:focus,.campo select:focus{border-color:var(--bronce);outline:2px solid rgba(184,148,91,.35);outline-offset:0}
.campo [aria-invalid="true"]{border-color:#E08A78;outline:2px solid rgba(224,138,120,.35)}
.campo .err{font-size:.78rem;color:#F0A898;font-weight:500}
.consentimiento{display:grid;grid-template-columns:22px minmax(0,1fr);gap:10px;font-size:.8rem;color:var(--pergamino);align-items:start;cursor:pointer}
.consentimiento input{width:20px;height:20px;margin:1px 0 0;accent-color:var(--bronce)}
.nota{font-size:.78rem;color:var(--pergamino);opacity:.85}

/* Hallazgos */
.hallazgos{list-style:none;margin:0;padding:0;display:grid;gap:14px;counter-reset:h}
.hallazgo{background:var(--blanco);border:1px solid var(--linea);border-left:4px solid var(--rojo);padding:18px 18px 20px;display:grid;gap:12px}
.hallazgo.amarillo{border-left-color:var(--amarillo)}.hallazgo.verde{border-left-color:var(--verde)}
.hallazgo h3{font-size:1rem;font-weight:700;display:flex;gap:10px;align-items:baseline}
.hallazgo h3::before{counter-increment:h;content:counter(h);font-family:var(--f-display);font-size:1.5rem;font-weight:500;color:var(--bronce-texto);line-height:1}
.hallazgo dl{margin:0;display:grid;gap:10px}
.hallazgo dt{font-size:.68rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--bronce-texto)}
.hallazgo dd{margin:2px 0 0;font-size:.95rem;color:var(--tinta-suave)}
.hallazgo .resuelve{background:var(--arena);padding:12px 14px;border-radius:2px}
.hallazgo .resuelve dd{color:var(--tinta)}
.aviso-wa{display:grid;grid-template-columns:40px minmax(0,1fr);gap:14px;align-items:center;background:var(--pizarra);color:var(--porcelana);padding:16px 18px;font-size:.92rem}
.aviso-wa .iso{width:40px;height:40px;border-radius:50%;background:var(--cobalto);display:grid;place-items:center;font-family:var(--f-iso);font-weight:700;color:var(--bronce);font-size:24px;line-height:1;padding-bottom:4px}
.aviso-wa b{color:var(--bronce);font-weight:600}
.acciones{display:grid;gap:10px}
.seguir{text-align:center;font-size:.88rem;color:var(--tinta-suave)}
.seguir a{color:var(--bronce-texto);font-weight:600}

/* Pie */
.pie{background:var(--medianoche);color:var(--pergamino);font-size:.8rem}
.pie .envoltura{padding-block:24px;display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px}
.pie a{text-decoration:none}.pie a:hover{color:var(--bronce)}

/* Solo para el PDF */
.solo-pdf{display:none}
/* Modo PDF: mismo armado que la impresión, para generar el archivo descargable */
body.modo-pdf #app{width:720px;max-width:none;padding:28px 32px;background:#fff}
body.modo-pdf .no-pdf,body.modo-pdf .volver{display:none!important}
body.modo-pdf .solo-pdf{display:block}
body.modo-pdf .pantalla{gap:14px;animation:none}
body.modo-pdf .pdf-cabeza{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2px solid var(--bronce);padding-bottom:8px;margin-bottom:6px}
body.modo-pdf .pdf-cabeza .logo{color:var(--tinta);font-size:1.3rem}
body.modo-pdf .pdf-cabeza p{font-size:.78rem;color:var(--tinta-suave);text-align:right}
body.modo-pdf .medidor svg{max-width:240px}
body.modo-pdf .hallazgo{break-inside:avoid}
body.modo-pdf .titulo-hallazgos{break-before:page;padding-top:4px}
body.modo-pdf .pdf-pie{margin-top:10px;padding-top:10px;border-top:1px solid var(--linea);font-size:.75rem;color:var(--tinta-suave)}
@media print{
  @page{size:A4;margin:14mm}
  body{background:#fff;font-size:11pt;display:block}
  .barra,.pie,.no-pdf,.volver{display:none!important}
  main{padding:0}
  .envoltura{max-width:none;padding:0}
  .solo-pdf{display:block}
  .pdf-cabeza{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2px solid var(--bronce);padding-bottom:8px;margin-bottom:14px}
  .pdf-cabeza .logo{color:var(--tinta);font-size:15pt}
  .pdf-cabeza p{font-size:9pt;color:var(--tinta-suave);text-align:right}
  .pantalla{gap:12px;animation:none}
  .tarjeta{border:1px solid var(--linea);padding:14px;break-inside:avoid}
  .medidor svg{max-width:220px}
  .hallazgo{break-inside:avoid;padding:12px 14px}
  .barras .relleno{transition:none}
  .pdf-pie{margin-top:14px;padding-top:10px;border-top:1px solid var(--linea);font-size:9pt;color:var(--tinta-suave)}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>

  var HALLAZGOS = [
    { // Google

  var app = document.getElementById("app");

  var estado = { paso: -1, respuestas: [], datos: null };

  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function color(v) { return v <= 40 ? "rojo" : v <= 70 ? "amarillo" : "verde"; }
  function nivel(v) { return v <= 40 ? "Por arrancar" : v <= 70 ? "En marcha" : "Sólida"; }
  function puntosArea(i) { return PREGUNTAS[i].opciones[estado.respuestas[i]][1]; }
  function esNoSe(i) { return !!PREGUNTAS[i].opciones[estado.respuestas[i]][2]; }
  function valorArea(i) { return Math.round(puntosArea(i) / 3 * 100); }
  function puntaje() {
    var t = 0; for (var i = 0; i < PREGUNTAS.length; i++) t += puntosArea(i);
    return Math.round(t / (PREGUNTAS.length * 3) * 100);
  }
  // Las 3 áreas más flojas (en empate, primero las de "no sé").
  function flojas() {
    return PREGUNTAS.map(function (_, i) { return i; })
      .sort(function (a, b) { return (puntosArea(a) - puntosArea(b)) || ((esNoSe(b) ? 1 : 0) - (esNoSe(a) ? 1 : 0)) || (a - b); })
      .slice(0, 3);
  }
  function hallazgo(i) {
    var p = puntosArea(i);
    if (esNoSe(i) && HALLAZGOS[i].nose) return HALLAZGOS[i].nose;

  /* ---------- Medidor y barras ---------- */
  function medidorSVG(v) {
    // Semicírculo de 180°: pista en tres tramos de semáforo + arco del puntaje.
    var R = 110, cx = 140, cy = 140, L = Math.PI * R;
    function arco() { return "M" + (cx - R) + " " + cy + " A" + R + " " + R + " 0 0 1 " + (cx + R) + " " + cy; }
    var tramo = function (desde, hasta, col) {
      return '<path d="' + arco() + '" fill="none" stroke="' + col + '" stroke-width="10" stroke-dasharray="0 ' + (L * desde) + ' ' + (L * (hasta - desde)) + ' ' + L + '" opacity=".28"/>';
    };
    // Colores escritos en el SVG (no variables CSS) para que también salgan en el PDF.
    var col = { rojo: "#B4533C", amarillo: "#D1A03C", verde: "#5B8A5E" }[color(v)];
    return '<svg viewBox="0 0 280 160" role="img" aria-label="Puntaje ' + v + ' de 100, nivel ' + nivel(v) + '">' +
      tramo(0, .405, "#B4533C") + tramo(.415, .705, "#D1A03C") + tramo(.715, 1, "#5B8A5E") +
      '<path class="arco-valor" d="' + arco() + '" fill="none" stroke="' + col + '" stroke-width="18" stroke-linecap="round" stroke-dasharray="' + L + '" stroke-dashoffset="' + L + '" style="transition:stroke-dashoffset 1.1s cubic-bezier(.2,.7,.1,1)" data-final="' + (L * (1 - Math.max(v, 2) / 100)) + '"/>' +
      '<text class="num" x="140" y="128" text-anchor="middle" fill="#0F1E33" font-family="EB Garamond, Georgia, serif" font-size="64" font-weight="500">' + v + '</text>' +
      '<text class="de" x="140" y="152" text-anchor="middle" fill="#46526A" font-family="Montserrat, Arial, sans-serif" font-size="15" font-weight="500">de 100</text>' +
      '</svg>';
  }

  function normalizarWA(raw) {
    var d = String(raw).replace(/\D/g, "");
    if (d.indexOf("00") === 0) d = d.slice(2);
    if (d.indexOf("54") === 0) d = d.slice(2);
    if (d.indexOf("9") === 0 && d.length === 11) d = d.slice(1);
    if (d.indexOf("0") === 0) d = d.slice(1);
    // Saca el "15" después de la característica (2, 3 o 4 dígitos) si sobra.
    if (d.length === 12) {
      for (var n = 2; n <= 4; n++) { if (d.substr(n, 2) === "15") { d = d.slice(0, n) + d.slice(n + 2); break; } }
    }
    return d.length === 10 ? "549" + d : "";
  }

  function enviar(e) {
    e.preventDefault();
    var f = e.target, ok = true;
    ["nombre", "cargo", "empresa", "rubro", "whatsapp"].forEach(function (id) {
      var el = f.elements[id], msg = "";
      if (!el.value.trim()) msg = "Completá este dato.";
      else if (id === "whatsapp" && !normalizarWA(el.value)) msg = "Revisá el número: característica + número, sin 0 ni 15.";
      var err = document.getElementById("err-" + id);

    document.getElementById("err-acepto").hidden = acepto.checked;
    if (!acepto.checked) ok = false;
    if (!ok) return;

    estado.datos = {

      cargo: f.elements.cargo.value,
      empresa: f.elements.empresa.value.trim(),
      rubro: f.elements.rubro.value,

      wa: normalizarWA(f.elements.whatsapp.value)

  function mensajeParaLead() {
    var d = estado.datos, v = puntaje(), h = hallazgo(flojas()[0]);

  function guardar(listo) {
    var hecho = false;
    function seguir() { if (!hecho) { hecho = true; listo(); } }
    if (!ENDPOINT) return seguir();
    var d = estado.datos, v = puntaje();
    var fila = {
      nombre: d.nombre, cargo: d.cargo, empresa: d.empresa, rubro: d.rubro,
      whatsapp: d.whatsapp, wa: d.wa, puntaje: v, nivel: nivel(v),
      flojos: flojas().map(function (i) { return PREGUNTAS[i].corto; }).join(", "),
      mensaje: mensajeParaLead(), origen: origen
    };
    PREGUNTAS.forEach(function (q, i) { fila["p" + (i + 1)] = q.opciones[estado.respuestas[i]][0]; });
    var body = new URLSearchParams(fila);
    // Primero fetch; si el navegador no lo permite o falla, sendBeacon (nunca los dos: no duplica filas).
    function beacon() {
      try { if (navigator.sendBeacon) navigator.sendBeacon(ENDPOINT, body); } catch (e) { /* sin guardado */ }
      seguir();
    }
    setTimeout(seguir, 4000);
    try {
      if (!window.fetch) return beacon();
      fetch(ENDPOINT, { method: "POST", mode: "no-cors", body: body, keepalive: true }).then(seguir, beacon);
    } catch (err) { beacon(); }
  }

  // El PDF no dibuja bien el SVG del medidor: para el PDF se dibuja el mismo medidor en un canvas.
  function medidorPNG(v) {
    var c = document.createElement("canvas"); c.width = 560; c.height = 320;
    var g = c.getContext("2d"), cx = 280, cy = 280, R = 220;
    var col = { rojo: "#B4533C", amarillo: "#D1A03C", verde: "#5B8A5E" };
    [[0, .405, col.rojo], [.415, .705, col.amarillo], [.715, 1, col.verde]].forEach(function (t) {
      g.beginPath(); g.globalAlpha = .28; g.strokeStyle = t[2]; g.lineWidth = 20; g.lineCap = "butt";
      g.arc(cx, cy, R, Math.PI * (1 + t[0]), Math.PI * (1 + t[1])); g.stroke();
    });
    g.globalAlpha = 1; g.beginPath(); g.strokeStyle = col[color(v)]; g.lineWidth = 36; g.lineCap = "round";
    g.arc(cx, cy, R, Math.PI, Math.PI * (1 + Math.max(v, 2) / 100)); g.stroke();
    g.textAlign = "center"; g.fillStyle = "#0F1E33"; g.font = '500 128px "EB Garamond", Georgia, serif';
    g.fillText(String(v), cx, 256);
    g.fillStyle = "#46526A"; g.font = '500 30px Montserrat, Arial, sans-serif';
    g.fillText("de 100", cx, 304);
    return c.toDataURL("image/png");
  }

  // Carga la librería del PDF solo cuando alguien la pide (no pesa en la carga del test).
  function cargarHtml2pdf(listo) {
    if (window.html2pdf) return listo(true);
    var sc = document.createElement("script");
    sc.src = "https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js";
    sc.onload = function () { listo(!!window.html2pdf); };
    sc.onerror = function () { listo(false); };
    document.head.appendChild(sc);
  }

  portada();
})();
</script>
